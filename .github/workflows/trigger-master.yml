name: Trigger Master Build

on:
  release:
    types: [published]

jobs:
  ping-master:
    runs-on: ubuntu-latest
    steps:
      - name: Send Dispatch Event to Master Repo
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPENDENCY_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://github.com \
            -d '{"event_type": "dependency_released", "client_payload": {"repo_name": "${{ github.repository }}"}}'
